name: study-rag
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study_local
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - study_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 5s
      retries: 15
  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11435:11434"]
    volumes: ["study_models:/root/.ollama"]
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 15
  models:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$EMBEDDING_MODEL && ollama pull $$CHAT_MODEL"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
    depends_on:
      ollama: {condition: service_healthy}
  app:
    build: .
    ports: ["127.0.0.1:8011:8000"]
    environment:
      DATABASE_URL: postgresql://study:study_local@db:5432/study
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
    depends_on:
      db: {condition: service_healthy}
      models: {condition: service_completed_successfully}
volumes:
  study_data:
  study_models:
